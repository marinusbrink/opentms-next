# ── PHASE 3 (§11, together with dept-build.yml) — activation is managed via ──────
# ── GitHub's workflow state ──────────────────────────────────────────────────────
# This caller is registered with its real triggers below and switched off with
# GitHub's first-class mechanism (`gh workflow disable "department — fix"`).
# This file cannot know that state — the source of truth is:
#     gh workflow list --repo marinusbrink/opentms-next
# To activate phase 3 (the gate-2 fix loop: human review comments on an agent
# feature PR → fix commits on the same PR, §5):
#     gh workflow enable "department — fix"
# and update this header.
name: department — fix

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    if: >-
      github.event.review.state != 'approved' &&
      !endsWith(github.actor, '[bot]') &&
      startsWith(github.event.pull_request.title, 'Feature:')
    uses: marinusbrink/dev-department/.github/workflows/fix.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
      # Same toolchain grant as dept-build.yml — the fix agent must build and
      # test what it fixes.
      extra-allowed-tools: "Bash(dotnet:*),Bash(abp:*),Bash(npm:*),Bash(npx:*),Bash(psql:*),Bash(./scripts/generate-openapi.sh)"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEPT_SYNC_TOKEN: ${{ secrets.DEPT_SYNC_TOKEN }}
