name: Staging database

# Staging's database is stoppable (PO decision 2026-10-30): it keeps its data and costs only disk while
# stopped. Stopped every evening; started on demand here and by the deploy workflow.

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: start or stop
        type: choice
        options: [start, stop]
        default: start

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-database
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: gh-deployer@ryd-platform.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: ${{ inputs.action || 'stop' }}
        run: |
          project="$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' infra/environments/staging.tfvars)"
          infra/scripts/staging-database.sh "${{ inputs.action || 'stop' }}" "$project" opentms-staging
