# ── PHASE 2 (§11 weeks 2–3) — activation is managed via GitHub's workflow state ──
# This caller is registered with its real triggers below and switched off with
# GitHub's first-class mechanism (`gh workflow disable "department — design"`).
# This file cannot know that state — the source of truth is:
#     gh workflow list --repo marinusbrink/opentms-next
# To activate phase 2 (the design gate: architect PRs to docs/designs/, human
# merge = gate 1):
#     gh workflow enable "department — design"
# and update this header. Alongside activation, stand up the docs site skeleton
# and OpenAPI publication (design §7) so the documentation agent participates
# from the first feature.
name: department — design

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  architect:
    if: github.event_name == 'issues' && github.event.label.name == 'status:design'
    uses: marinusbrink/dev-department/.github/workflows/design.yml@main
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEPT_SYNC_TOKEN: ${{ secrets.DEPT_SYNC_TOKEN }}

  design-merged:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'Design:')
    uses: marinusbrink/dev-department/.github/workflows/design.yml@main
    with:
      mode: design-merged
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEPT_SYNC_TOKEN: ${{ secrets.DEPT_SYNC_TOKEN }}
