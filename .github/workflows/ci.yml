# CI for opentms-next: correctness only, in parallel jobs. The deploy (deploy.yml) starts when the whole workflow is
# green and measures performance itself (docs/designs/76-ci-split-and-performance-gate.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the department build pipeline when a feature PR goes
  # gate-2-ready: agent pushes use GITHUB_TOKEN, whose events never trigger
  # workflows, so the pipeline kicks CI explicitly on the feature branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Correctness, in parallel jobs (docs/designs/76-ci-split-and-performance-gate.md). Every test runs here; the volume tests
  # with OPENTMS_VOLUME_BUDGETS=report, because a shared runner's speed decides a timing more than the code does. Their
  # budgets are enforced by the deploy's performance gate, on a database the size of prod's.
  backend-unit:
    name: Backend — build, unit and architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: nuget-
      - name: Build
        run: dotnet build backend/OpenTms.slnx --nologo
      - name: Domain, architecture and application tests
        run: |
          for project in OpenTms.Domain.Tests OpenTms.ArchitectureTests OpenTms.Application.Tests; do
            dotnet test "backend/test/$project" --no-build --nologo
          done

  backend-host:
    name: Backend — host integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: nuget-
      - name: Host integration tests
        run: dotnet test backend/test/OpenTms.HttpApi.Host.Tests --nologo

  # OpenTms.EntityFrameworkCore.Tests split by namespace, balanced on measured durations (design 76). The last shard
  # takes everything the others do not, so a new namespace always runs somewhere.
  backend-database:
    name: Backend — database tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: planning and reporting
            filter: "FullyQualifiedName~OpenTms.EntityFrameworkCore.PlanningExecution.|FullyQualifiedName~OpenTms.PostgreSql.Reporting."
          - shard: master data and orders
            filter: "FullyQualifiedName~OpenTms.EntityFrameworkCore.MasterData.|FullyQualifiedName~OpenTms.PostgreSql.MasterData.|FullyQualifiedName~OpenTms.PostgreSql.Orders."
          - shard: orders, planning and platform
            filter: "FullyQualifiedName~OpenTms.EntityFrameworkCore.Orders.|FullyQualifiedName~OpenTms.PostgreSql.PlanningExecution.|FullyQualifiedName~OpenTms.PostgreSql.TestData.|FullyQualifiedName~OpenTms.PostgreSql.Tenants.|FullyQualifiedName~OpenTms.PostgreSql.Intake.|FullyQualifiedName~OpenTms.PostgreSql.Financial.|FullyQualifiedName~OpenTms.PostgreSql.Platform."
          - shard: everything else
            filter: "FullyQualifiedName!~OpenTms.EntityFrameworkCore.PlanningExecution.&FullyQualifiedName!~OpenTms.PostgreSql.Reporting.&FullyQualifiedName!~OpenTms.EntityFrameworkCore.MasterData.&FullyQualifiedName!~OpenTms.PostgreSql.MasterData.&FullyQualifiedName!~OpenTms.PostgreSql.Orders.&FullyQualifiedName!~OpenTms.EntityFrameworkCore.Orders.&FullyQualifiedName!~OpenTms.PostgreSql.PlanningExecution.&FullyQualifiedName!~OpenTms.PostgreSql.TestData.&FullyQualifiedName!~OpenTms.PostgreSql.Tenants.&FullyQualifiedName!~OpenTms.PostgreSql.Intake.&FullyQualifiedName!~OpenTms.PostgreSql.Financial.&FullyQualifiedName!~OpenTms.PostgreSql.Platform."
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENTMS_VOLUME_BUDGETS: report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: nuget-
      - name: Database tests
        run: dotnet test backend/test/OpenTms.EntityFrameworkCore.Tests --nologo --filter "${{ matrix.filter }}"

  backend-migrations:
    name: Backend — migrations, login assets, OpenAPI freshness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.props') }}
          restore-keys: nuget-

      - name: Build
        run: dotnet build backend/OpenTms.slnx --nologo

      - name: Migrate fresh host database
        run: dotnet run --project backend/src/OpenTms.DbMigrator --no-build

      - name: Assert module schemas exist in host database
        run: |
          for schema in platform orders planning financial masterdata integrations reporting; do
            psql "host=localhost user=postgres password=postgres dbname=OpenTms" -tAc \
              "SELECT 1 FROM information_schema.schemata WHERE schema_name='${schema}'" | grep -q 1 \
              || { echo "::error::schema '${schema}' missing in host database"; exit 1; }
          done

      - name: Provision a tenant database (database-per-tenant default)
        run: |
          TENANT_ID=$(python3 -c "import uuid; print(uuid.uuid4())")
          STAMP=$(python3 -c "import uuid; print(uuid.uuid4().hex)")
          psql "host=localhost user=postgres password=postgres dbname=OpenTms" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO "AbpTenants" ("Id","Name","NormalizedName","EntityVersion","ExtraProperties","ConcurrencyStamp","CreationTime","IsDeleted")
          VALUES ('${TENANT_ID}','ci-tenant','CI-TENANT',0,'{}','${STAMP}',now(),false);
          INSERT INTO "AbpTenantConnectionStrings" ("TenantId","Name","Value")
          VALUES ('${TENANT_ID}','Default','Host=localhost;Port=5432;Database=OpenTms_CiTenant;Username=postgres;Password=postgres');
          SQL
          # Second run: must create + migrate + seed the tenant database and exit 0.
          dotnet run --project backend/src/OpenTms.DbMigrator --no-build

      - name: Assert module schemas exist in tenant database
        run: |
          for schema in platform orders planning financial masterdata integrations reporting; do
            psql "host=localhost user=postgres password=postgres dbname=OpenTms_CiTenant" -tAc \
              "SELECT 1 FROM information_schema.schemata WHERE schema_name='${schema}'" | grep -q 1 \
              || { echo "::error::schema '${schema}' missing in tenant database"; exit 1; }
          done

      # wwwroot/libs is untracked by ABP convention; without this step a fresh clone
      # never has working auth-server login pages. Runs before the host boots below.
      - name: Install auth-server login-page assets (abp install-libs)
        working-directory: backend
        run: |
          dotnet tool install -g Volo.Abp.Studio.Cli
          abp install-libs

      - name: Assert login-page assets landed in the host wwwroot
        run: |
          test -f backend/src/OpenTms.HttpApi.Host/wwwroot/libs/abp/core/abp.js \
            || { echo "::error::abp install-libs did not populate backend/src/OpenTms.HttpApi.Host/wwwroot/libs — the auth server's login page would be broken"; exit 1; }

      - name: OpenAPI spec freshness
        run: |
          ./scripts/generate-openapi.sh
          git diff --exit-code -- openapi/ \
            || { echo "::error::openapi/opentms-next.json is out of date — run ./scripts/generate-openapi.sh and commit"; exit 1; }

  frontend:
    name: Frontend — client freshness, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Generated client freshness
        run: |
          npm run generate:client
          git diff --exit-code -- src/lib/api/generated \
            || { echo "::error::the generated TypeScript client is out of date — run npm run generate:client and commit"; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Build (includes type-check)
        run: npm run build
